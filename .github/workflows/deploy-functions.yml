name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: 2.1.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Deploy changed edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD -- supabase/functions/ \
            | grep '^supabase/functions/' \
            | sed 's|supabase/functions/||' \
            | cut -d'/' -f1 \
            | sort -u)

          if [ -z "$changed" ]; then
            echo "No function changes detected."
            exit 0
          fi

          echo "Functions to deploy: $changed"
          for fn in $changed; do
            echo "Deploying $fn..."
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
