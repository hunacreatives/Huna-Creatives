name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: 2.1.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Deploy changed edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # Compare against the commit before this push (not just HEAD~1), so a
          # push with several commits deploys everything it changed.
          base="${{ github.event.before }}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=HEAD~1; fi
          files=$(git diff --name-only "$base" HEAD -- supabase/functions/)

          # Changed function folders; _shared is a library, not a function.
          changed=$(echo "$files" | grep '^supabase/functions/' | sed 's|supabase/functions/||' \
            | cut -d'/' -f1 | grep -v '^_' || true)

          # A changed shared file redeploys every function that imports it.
          for shared in $(echo "$files" | grep '^supabase/functions/_shared/' | xargs -r -n1 basename); do
            importers=$(grep -l "_shared/$shared" supabase/functions/*/index.ts 2>/dev/null \
              | xargs -r -n1 dirname | xargs -r -n1 basename)
            changed="$changed $importers"
          done

          changed=$(echo $changed | tr ' ' '\n' | grep -v '^$' | sort -u)
          if [ -z "$changed" ]; then
            echo "No function changes detected."
            exit 0
          fi

          echo "Functions to deploy:" $changed
          for fn in $changed; do
            [ -d "supabase/functions/$fn" ] || { echo "Skipping $fn (deleted)"; continue; }
            echo "Deploying $fn..."
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
